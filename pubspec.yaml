publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  intl: ^0.19.0
  path: ^1.9.0
  path_provider: ^2.1.5
  sqflite: ^2.4.1
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  image_cropper: ^8.1.0
